<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            border: 2px solid #16213e;
            border-radius: 5px;
            background: #0f3460;
            display: block;
            margin: 0 auto;
        }
        .controls {
            margin-top: 10px;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <p>Use <strong>Left/Right Arrows</strong> or <strong>Mouse</strong> to move</p>
            <p>Press <strong>Space</strong> to start/restart</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let gameOver = false;

        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 10,
            dx: 7
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            dx: 4,
            dy: -4,
            radius: 8
        };

        const brickInfo = {
            rows: 5,
            cols: 9,
            width: 70,
            height: 20,
            padding: 10,
            offsetTop: 50,
            offsetLeft: 35
        };

        let bricks = [];
        let rightPressed = false;
        let leftPressed = false;

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickInfo.cols; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickInfo.rows; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.fillStyle = '#e94560';
            ctx.fill();
            ctx.closePath();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickInfo.cols; c++) {
                for (let r = 0; r < brickInfo.rows; r++) {
                    const brickX = (c * (brickInfo.width + brickInfo.padding)) + brickInfo.offsetLeft;
                    const brickY = (r * (brickInfo.height + brickInfo.padding)) + brickInfo.offsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;

                    if (bricks[c][r].status === 1) {
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickInfo.width, brickInfo.height);
                        const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#5f27cd', '#54a0ff'];
                        ctx.fillStyle = colors[r % colors.length];
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawStats() {
            ctx.font = '20px Arial';
            ctx.fillStyle = '#fff';
            ctx.fillText('Score: ' + score, 10, 25);
            ctx.fillText('Lives: ' + lives, canvas.width - 90, 25);

            if (!gameRunning && !gameOver) {
                ctx.font = '30px Arial';
                ctx.fillStyle = '#fff';
                ctx.fillText('Press SPACE to Start', canvas.width / 2 - 130, canvas.height / 2);
            }

            if (gameOver) {
                ctx.font = '40px Arial';
                ctx.fillStyle = gameOver === 'win' ? '#00b894' : '#d63031';
                ctx.fillText(gameOver === 'win' ? 'YOU WIN!' : 'GAME OVER', canvas.width / 2 - 110, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillStyle = '#fff';
                ctx.fillText('Press SPACE to play again', canvas.width / 2 - 135, canvas.height / 2 + 40);
            }
        }

        function collisionDetection() {
            for (let c = 0; c < brickInfo.cols; c++) {
                for (let r = 0; r < brickInfo.rows; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (ball.x > b.x && ball.x < b.x + brickInfo.width && ball.y > b.y && ball.y < b.y + brickInfo.height) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score++;
                            if (score === brickInfo.rows * brickInfo.cols) {
                                gameOver = 'win';
                                gameRunning = false;
                            }
                        }
                    }
                }
            }
        }

        function update() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawPaddle();
            drawBall();
            drawStats();

            if (gameOver) {
                return;
            }

            collisionDetection();

            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }

            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            } else if (ball.y + ball.dy > canvas.height - ball.radius) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    ball.dy = -ball.dy;
                    const hitPoint = ball.x - (paddle.x + paddle.width / 2);
                    ball.dx = hitPoint * 0.15;
                } else {
                    lives--;
                    if (!lives) {
                        gameOver = true;
                        gameRunning = false;
                        return;
                    } else {
                        ball.x = canvas.width / 2;
                        ball.y = canvas.height - 50;
                        ball.dx = 4;
                        ball.dy = -4;
                        paddle.x = canvas.width / 2 - 50;
                    }
                }
            }

            if (rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.dx;
            } else if (leftPressed && paddle.x > 0) {
                paddle.x -= paddle.dx;
            }

            ball.x += ball.dx;
            ball.y += ball.dy;
        }

        function gameLoop() {
            update();
            if (gameRunning || !gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        function startGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            gameRunning = true;
            initBricks();
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = 4;
            ball.dy = -4;
            paddle.x = canvas.width / 2 - 50;
            gameLoop();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = true;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = true;
            } else if (e.code === 'Space') {
                if (!gameRunning && !gameOver) {
                    startGame();
                } else if (gameOver) {
                    startGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'Right' || e.key === 'ArrowRight') {
                rightPressed = false;
            } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                leftPressed = false;
            }
        });

        document.addEventListener('mousemove', (e) => {
            const relativeX = e.clientX - canvas.offsetLeft;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
                if (paddle.x < 0) paddle.x = 0;
                if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
            }
        });

        initBricks();
        drawBricks();
        drawPaddle();
        drawStats();
    </script>
</body>
</html>
