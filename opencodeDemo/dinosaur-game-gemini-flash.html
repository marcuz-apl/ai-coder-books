<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dino Run</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f7f7;
            font-family: 'Press+Start+2P', cursive;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background-color: white;
            image-rendering: pixelated;
        }
        canvas {
            display: block;
            background-color: white;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.7);
        }
        #game-over-text {
            font-size: 24px;
            color: #535353;
            margin-bottom: 20px;
        }
        #score-final {
            font-size: 16px;
            color: #757575;
            margin-bottom: 30px;
        }
        #restart-btn {
            padding: 15px 30px;
            background-color: #535353;
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Press+Start+2P', cursive;
            font-size: 14px;
            transition: transform 0.1s;
        }
        #restart-btn:active {
            transform: scale(0.95);
        }
        #score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 16px;
            color: #535353;
        }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas" width="800" height="200"></canvas>
    <div id="score-board">00000</div>
    <div id="ui">
        <div id="game-over-text">G A M E  O V E R</div>
        <div id="score-final">SCORE: 00000</div>
        <button id="restart-btn">RESTART</button>
    </div>
</div>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    const scoreBoard = document.getElementById('score-board');
    const scoreFinal = document.getElementById('score-final');
    const restartBtn = document.getElementById('restart-btn');
    // Configuration
    const GRAVITY = 0.6;
    const JUMP_FORCE = -12;
    const GROUND_Y = 170;
    const PIXEL_SIZE = 4;
    // Dino Pixel Art (12x12 grid)
    const DINO_DATA = [
        "      RRRRRR",
        "      RRRRRRRR",
        "      RRRRRRRR",
        "      RRRRRR",
        "      RRRRRRRRR",
        "R     RRRRRR",
        "R     RRRRRR",
        "RR   RRRRRRR",
        "RRRRRRRRRRR",
        " RRRRRRRRRR",
        "  RRRRRRRR",
        "   R    R",
        "   RR   RR"
    ];
    // Cactus Pixel Art (variations)
    const CACTUS_DATA = [
        [
            "  GG  ",
            "  GG  ",
            "GGGGGG",
            "GGGGGG",
            "  GG  ",
            "  GG  ",
            "  GG  ",
            "  GG  "
        ],
        [
            "  GG  ",
            "GGGG  ",
            "GGGG  ",
            "  GG  ",
            "  GG  "
        ]
    ];
    class Sprite {
        constructor(x, y, data, color) {
            this.x = x;
            this.y = y;
            this.data = data;
            this.color = color;
            this.width = data[0].length * PIXEL_SIZE;
            this.height = data.length * PIXEL_SIZE;
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            for (let row = 0; row < this.data.length; row++) {
                for (let col = 0; col < this.data[row].length; col++) {
                    if (this.data[row][col] !== ' ') {
                        ctx.fillRect(
                            this.x + (col * PIXEL_SIZE),
                            this.y + (row * PIXEL_SIZE),
                            PIXEL_SIZE,
                            PIXEL_SIZE
                        );
                    }
                }
            }
        }
    }
    class Dino extends Sprite {
        constructor() {
            super(50, GROUND_Y - (DINO_DATA.length * PIXEL_SIZE), DINO_DATA, '#535353');
            this.velocityY = 0;
            this.isJumping = false;
            this.baseY = this.y;
        }
        jump() {
            if (!this.isJumping) {
                this.velocityY = JUMP_FORCE;
                this.isJumping = true;
            }
        }
        update() {
            this.y += this.velocityY;
            this.velocityY += GRAVITY;
            if (this.y > this.baseY) {
                this.y = this.baseY;
                this.velocityY = 0;
                this.isJumping = false;
            }
        }
    }
    class Cactus extends Sprite {
        constructor(speed) {
            const variant = Math.floor(Math.random() * CACTUS_DATA.length);
            const data = CACTUS_DATA[variant];
            super(canvas.width, GROUND_Y - (data.length * PIXEL_SIZE), data, '#535353');
            this.speed = speed;
        }
        update() {
            this.x -= this.speed;
        }
    }
    let dino;
    let obstacles = [];
    let score = 0;
    let gameActive = false;
    let gameSpeed = 6;
    let nextObstacleTimer = 0;
    function init() {
        dino = new Dino();
        obstacles = [];
        score = 0;
        gameSpeed = 6;
        nextObstacleTimer = 0;
        gameActive = true;
        ui.style.display = 'none';
        scoreBoard.innerText = '00000';
        requestAnimationFrame(gameLoop);
    }
    function spawnObstacle() {
        if (nextObstacleTimer <= 0) {
            obstacles.push(new Cactus(gameSpeed));
            nextObstacleTimer = Math.random() * 100 + 50; // Delay between obstacles
        }
        nextObstacleTimer--;
    }
    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }
    function gameOver() {
        gameActive = false;
        ui.style.display = 'flex';
        scoreFinal.innerText = `SCORE: ${Math.floor(score).toString().padStart(5, '0')}`;
    }
    function drawGround() {
        ctx.strokeStyle = '#535353';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(canvas.width, GROUND_Y);
        ctx.stroke();
        // Random ground dots for texture
        ctx.fillStyle = '#535353';
        for(let i = 0; i < canvas.width; i += 40) {
            let offset = (i + (Date.now() / 10 * (gameSpeed/6))) % canvas.width;
            ctx.fillRect(canvas.width - offset, GROUND_Y + 10, 2, 2);
            ctx.fillRect(canvas.width - ((offset + 20) % canvas.width), GROUND_Y + 15, 3, 2);
        }
    }
    function gameLoop() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Update
        dino.update();
        spawnObstacle();
        gameSpeed += 0.001; // Gradually increase speed
        score += 0.1;
        scoreBoard.innerText = Math.floor(score).toString().padStart(5, '0');
        // Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].update();
            obstacles[i].draw(ctx);
            if (checkCollision(dino, obstacles[i])) {
                gameOver();
            }
            if (obstacles[i].x + obstacles[i].width < 0) {
                obstacles.splice(i, 1);
            }
        }
        // Draw
        drawGround();
        dino.draw(ctx);
        requestAnimationFrame(gameLoop);
    }
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (gameActive) {
                dino.jump();
            } else if (ui.style.display === 'flex') {
                init();
            } else {
                init(); // Start first time
            }
        }
    });
    restartBtn.addEventListener('click', init);
    // Initial message
    ctx.fillStyle = '#535353';
    ctx.font = '12px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('PRESS SPACE TO START', canvas.width/2, canvas.height/2);
</script>
</body>
</html>
