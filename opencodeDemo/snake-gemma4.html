<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 10px ridge #444;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .game-container {
            text-align: center;
        }
        h1 {
            color: #4CAF50;
        }
        #score {
            color: white;
            margin-top: 15px;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Snake Game</h1>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="score">Score: 0</div>
        <p>Use Arrow Keys or WASD to move</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        // Game settings
        const TILE_SIZE = 20;
        const GRID_UNITS = Math.floor(canvas.width / TILE_SIZE);
        
        // Game state variables
        let snake = [{ x: 10, y: 10 }];
        let food = generateRandomFood();
        let direction = { x: 0, y: 0 }; // Initial direction: stop
        let score = 0;
        let gameLoopInterval;
        const GAME_SPEED = 150; // milliseconds per frame

        // --- Game Logic Functions ---

        function generateRandomFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_UNITS),
                    y: Math.floor(Math.random() * GRID_UNITS)
                };
            } while (isOccupied(newFood, snake));
            return newFood;
        }

        function isOccupied(pos, snakeBody) {
            return snakeBody.some(segment => segment.x === pos.x && segment.y === pos.y);
        }

        function handleInput(e) {
            const keyPressed = e.key;
            let newDirection;

            switch (keyPressed) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y === 0) newDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y === 0) newDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x === 0) newDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x === 0) newDirection = { x: 1, y: 0 };
                    break;
                default:
                    return; // Ignore other keys
            }
            
            // Prevent immediate reversal
            if (newDirection.x !== -direction.x || newDirection.y !== -direction.y) {
                direction = newDirection;
            }
        }

        function updateGame() {
            if (checkGameOver()) {
                clearInterval(gameLoopInterval);
                alert(`Game Over! Your score is: ${score}`);
                document.location.reload(); // Restart the game
                return;
            }

            // 1. Calculate the new head position
            const newHead = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };

            // 2. Add the new head to the snake's body
            snake.unshift(newHead);

            // 3. Check for collisions (Food eaten or wall collision)
            if (checkCollision(newHead)) {
                // Game Over handled by checkGameOver, but we break here just in case
                return; 
            }

            // 4. Check for food consumption
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                scoreDisplay.textContent = `Score: ${score}`;
                food = generateRandomFood();
                // Don't pop the tail (snake grows)
            } else {
                // Standard movement: remove the tail segment
                snake.pop();
            }

            // 5. Check for wall collision (redundant but good safety check)
            if (newHead.x < 0 || newHead.x >= GRID_UNITS || newHead.y < 0 || newHead.y >= GRID_UNITS) {
                gameOver();
            }
        }

        function checkCollision(head) {
            // Wall collision check
            if (head.x < 0 || head.x >= GRID_UNITS || head.y < 0 || head.y >= GRID_UNITS) {
                return true;
            }

            // Self-collision check (Check against the body segments starting from the 2nd segment, 
            // since the new head cannot collide with itself)
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function checkGameOver() {
            // This simple implementation only checks collision inside updateGame, 
            // but checking here allows an early return if the collision happens.
            // The main check relies on the logic within updateGame running the full cycle.
            return false; 
        }

        function gameOver() {
            // The dedicated simple collision detection that was implemented in updateGame 
            // already pops the tail if safe, so we must ensure we clear the interval 
            // and show the failure state.
            clearInterval(gameLoopInterval);
            alert(`Game Over! You hit a wall or yourself. Score: ${score}`);
            // Optional: Reset the game state here if the user wants to play again without reload.
        }


        // --- Drawing and Initialization ---

        function draw() {
            // Clear the canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.fillStyle = '#FF4136'; // Reddish color for visible food
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

            // Draw snake
            snake.forEach((segment, index) => {
                let color = index === 0 ? '#4CAF50' : '#8BC34E'; // Head color vs body color
                
                // Draw the segment with a small border for separation
                ctx.fillStyle = color;
                ctx.fillRect(segment.x * TILE_SIZE, segment.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
                ctx.strokeStyle = '#111';
                ctx.strokeRect(segment.x * TILE_SIZE, segment.y * TILE_SIZE, TILE_SIZE - 1, TILE_SIZE - 1);
            });
        }

        function gameLoop() {
            updateGame();
            draw();
        }

        function initGame() {
            // Set initial direction to allow movement instantly after start
            direction = { x: 1, y: 0 }; 
            // Start the game loop
            gameLoopInterval = setInterval(gameLoop, GAME_SPEED);
        }

        // --- Setup Event Listeners ---
        document.addEventListener('keyup', handleInput);

        // Start the game when the page loads
        initGame();

    </script>
</body>
</html>
