<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dinosaur Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f7f7f7;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: #fff;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        #game-canvas {
            background: #fff;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            display: none;
        }

        #game-over h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff5555;
        }

        #final-score {
            font-size: 32px;
            margin-bottom: 30px;
        }

        #restart-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: background 0.3s;
        }

        #restart-btn:hover {
            background: #45a049;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        #start-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #333;
        }

        #start-screen p {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: background 0.3s;
        }

        #start-btn:hover {
            background: #45a049;
        }

        .pixel {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="400"></canvas>
        <div id="score">Score: 0</div>
        <div id="game-over">
            <h2>GAME OVER</h2>
            <div id="final-score">Score: 0</div>
            <button id="restart-btn">RESTART</button>
        </div>
        <div id="start-screen">
            <h1>PIXEL DINOSAUR</h1>
            <p>Press SPACE to jump over cacti!</p>
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');

        // Game state
        let gameRunning = false;
        let score = 0;
        let gameSpeed = 5;
        let frames = 0;

        // Dinosaur properties
        const dino = {
            x: 50,
            y: 300,
            width: 40,
            height: 60,
            jumping: false,
            jumpVelocity: 0,
            gravity: 0.8,
            jumpPower: 15,
            draw() {
                // Draw dinosaur body
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Draw dinosaur head
                ctx.fillRect(this.x + 30, this.y - 20, 20, 20);

                // Draw eye
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x + 45, this.y - 15, 5, 5);

                // Draw legs
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x + 5, this.y + 55, 10, 15);
                ctx.fillRect(this.x + 25, this.y + 55, 10, 15);
            },
            jump() {
                if (!this.jumping) {
                    this.jumping = true;
                    this.jumpVelocity = -this.jumpPower;
                }
            },
            update() {
                if (this.jumping) {
                    this.y += this.jumpVelocity;
                    this.jumpVelocity += this.gravity;

                    if (this.y >= 300) {
                        this.y = 300;
                        this.jumping = false;
                    }
                }
            }
        };

        // Ground properties
        const ground = {
            x: 0,
            y: 360,
            width: 800,
            height: 40,
            draw() {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Draw ground details
                ctx.fillStyle = '#A0522D';
                for (let i = 0; i < 20; i++) {
                    ctx.fillRect(i * 40, 360, 20, 5);
                }
            }
        };

        // Cactus properties
        const cacti = [];

        class Cactus {
            constructor() {
                this.width = 20;
                this.height = Math.random() * 50 + 30;
                this.x = 800;
                this.y = 360 - this.height;
                this.speed = gameSpeed;
            }

            draw() {
                ctx.fillStyle = '#228B22';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Draw cactus details
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(this.x - 5, this.y + 10, 5, 10);
                ctx.fillRect(this.x + this.width, this.y + 20, 5, 15);
                ctx.fillRect(this.x + 5, this.y - 10, 5, 10);
            }

            update() {
                this.x -= this.speed;
            }
        }

        // Game functions
        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, 800, 400);

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(100, 50, 60, 30);
            ctx.fillRect(120, 40, 40, 20);
            ctx.fillRect(500, 80, 80, 30);
            ctx.fillRect(520, 70, 40, 20);
            ctx.fillRect(700, 30, 60, 30);
            ctx.fillRect(720, 20, 40, 20);
        }

        function updateScore() {
            score = Math.floor(frames / 10);
            scoreElement.textContent = `Score: ${score}`;
        }

        function createCactus() {
            if (frames % 100 === 0) {
                cacti.push(new Cactus());
            }
        }

        function updateCacti() {
            for (let i = 0; i < cacti.length; i++) {
                cacti[i].update();

                // Remove cacti that are off screen
                if (cacti[i].x + cacti[i].width < 0) {
                    cacti.splice(i, 1);
                    i--;
                }

                // Collision detection
                if (
                    dino.x < cacti[i].x + cacti[i].width &&
                    dino.x + dino.width > cacti[i].x &&
                    dino.y < cacti[i].y + cacti[i].height &&
                    dino.y + dino.height > cacti[i].y
                ) {
                    gameOver();
                }
            }
        }

        function drawCacti() {
            for (let i = 0; i < cacti.length; i++) {
                cacti[i].draw();
            }
        }

        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            gameRunning = true;
            score = 0;
            frames = 0;
            cacti.length = 0;
            dino.y = 300;
            dino.jumping = false;
            gameOverScreen.style.display = 'none';
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw game elements
            drawBackground();
            ground.draw();
            dino.draw();
            drawCacti();

            // Update game state
            dino.update();
            updateScore();
            createCactus();
            updateCacti();

            frames++;

            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                if (!gameRunning && !gameOverScreen.style.display) {
                    // Start the game if not running and not game over
                    startScreen.style.display = 'none';
                    gameRunning = true;
                    gameLoop();
                } else if (gameRunning) {
                    // Jump if game is running
                    dino.jump();
                }
            }
        });

        startBtn.addEventListener('click', function() {
            startScreen.style.display = 'none';
            gameRunning = true;
            gameLoop();
        });

        restartBtn.addEventListener('click', function() {
            restartGame();
            gameLoop();
        });

        // Initialize game
        drawBackground();
        ground.draw();
        dino.draw();
    </script>
</body>
</html>
