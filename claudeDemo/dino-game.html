<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dino Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f7f7;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 600px;
            height: 300px;
            border: 2px solid #333;
            background-color: #fff;
            overflow: hidden;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30px;
            background-color: #555;
        }

        .dino {
            position: absolute;
            bottom: 30px;
            left: 50px;
            width: 40px;
            height: 60px;
            background-color: #333;
            border-radius: 5px;
        }

        .cactus {
            position: absolute;
            bottom: 30px;
            width: 20px;
            height: 40px;
            background-color: #4caf50;
            border-radius: 3px;
        }

        .cloud {
            position: absolute;
            background-color: #f0f0f0;
            border-radius: 50%;
        }

        .score {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: bold;
            color: #e74c3c;
            display: none;
            text-align: center;
        }

        .restart-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .restart-btn:hover {
            background-color: #2980b9;
        }

        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="instructions">Press SPACE to jump</div>
        <div class="score">Score: 0</div>
        <div class="dino"></div>
        <div class="ground"></div>
        <div class="game-over">
            GAME OVER<br>
            <span class="final-score">Score: 0</span><br>
            <button class="restart-btn">Restart</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Game elements
            const gameContainer = document.querySelector('.game-container');
            const dino = document.querySelector('.dino');
            const scoreDisplay = document.querySelector('.score');
            const gameOverDisplay = document.querySelector('.game-over');
            const finalScoreDisplay = document.querySelector('.final-score');
            const restartBtn = document.querySelector('.restart-btn');

            // Game variables
            let isJumping = false;
            let isGameOver = false;
            let score = 0;
            let gameSpeed = 5;
            let gravity = 0.9;
            let jumpCount = 0;
            let position = 0;
            let cacti = [];
            let clouds = [];
            let gameInterval;

            // Initialize game
            function initGame() {
                isGameOver = false;
                score = 0;
                gameSpeed = 5;
                position = 0;
                jumpCount = 0;

                // Clear existing cacti and clouds
                cacti.forEach(cactus => cactus.remove());
                clouds.forEach(cloud => cloud.remove());
                cacti = [];
                clouds = [];

                // Reset dino position
                dino.style.bottom = '30px';
                dino.style.transform = 'translateY(0)';

                // Hide game over screen
                gameOverDisplay.style.display = 'none';

                // Update score
                updateScore();

                // Start game loop
                gameInterval = setInterval(gameLoop, 20);

                // Generate initial clouds
                generateCloud();
                setTimeout(generateCloud, 2000);
                setTimeout(generateCloud, 4000);
            }

            // Game loop
            function gameLoop() {
                if (isGameOver) return;

                // Move cacti
                moveCacti();

                // Move clouds
                moveClouds();

                // Generate new cacti
                if (Math.random() < 0.02) {
                    generateCactus();
                }

                // Generate new clouds
                if (Math.random() < 0.01) {
                    generateCloud();
                }

                // Apply gravity
                applyGravity();

                // Increase score
                score++;
                updateScore();

                // Increase difficulty over time
                if (score % 500 === 0) {
                    gameSpeed += 0.5;
                }
            }

            // Generate cactus
            function generateCactus() {
                const cactus = document.createElement('div');
                cactus.classList.add('cactus');
                cactus.style.right = '-20px';
                cactus.style.bottom = '30px';
                gameContainer.appendChild(cactus);
                cacti.push(cactus);
            }

            // Generate cloud
            function generateCloud() {
                const cloud = document.createElement('div');
                cloud.classList.add('cloud');

                // Random size and position
                const size = Math.random() * 30 + 20;
                cloud.style.width = `${size}px`;
                cloud.style.height = `${size * 0.6}px`;
                cloud.style.right = '-50px';
                cloud.style.top = `${Math.random() * 100 + 20}px`;

                gameContainer.appendChild(cloud);
                clouds.push(cloud);
            }

            // Move cacti
            function moveCacti() {
                for (let i = 0; i < cacti.length; i++) {
                    const cactus = cacti[i];
                    const cactusRight = parseInt(cactus.style.right) || 0;
                    cactus.style.right = `${cactusRight + gameSpeed}px`;

                    // Remove cacti that have moved off screen
                    if (cactusRight > 600) {
                        cactus.remove();
                        cacti.splice(i, 1);
                        i--;
                        continue;
                    }

                    // Check collision
                    if (checkCollision(cactus)) {
                        endGame();
                        return;
                    }
                }
            }

            // Move clouds
            function moveClouds() {
                for (let i = 0; i < clouds.length; i++) {
                    const cloud = clouds[i];
                    const cloudRight = parseInt(cloud.style.right) || 0;
                    cloud.style.right = `${cloudRight + gameSpeed * 0.5}px`;

                    // Remove clouds that have moved off screen
                    if (cloudRight > 650) {
                        cloud.remove();
                        clouds.splice(i, 1);
                        i--;
                    }
                }
            }

            // Check collision
            function checkCollision(cactus) {
                const dinoRect = dino.getBoundingClientRect();
                const cactusRect = cactus.getBoundingClientRect();

                return (
                    dinoRect.left < cactusRect.right &&
                    dinoRect.right > cactusRect.left &&
                    dinoRect.top < cactusRect.bottom &&
                    dinoRect.bottom > cactusRect.top
                );
            }

            // Apply gravity
            function applyGravity() {
                if (isJumping) {
                    position += jumpCount;
                    jumpCount -= gravity;
                    dino.style.bottom = `${30 + position}px`;

                    if (position <= 0) {
                        isJumping = false;
                        position = 0;
                        dino.style.bottom = '30px';
                    }
                }
            }

            // Jump function
            function jump() {
                if (!isJumping && !isGameOver) {
                    isJumping = true;
                    jumpCount = 15;
                }
            }

            // Update score display
            function updateScore() {
                scoreDisplay.textContent = `Score: ${Math.floor(score / 10)}`;
            }

            // End game
            function endGame() {
                isGameOver = true;
                clearInterval(gameInterval);

                // Show game over screen
                finalScoreDisplay.textContent = `Score: ${Math.floor(score / 10)}`;
                gameOverDisplay.style.display = 'block';
            }

            // Event listeners
            document.addEventListener('keydown', (event) => {
                if (event.code === 'Space') {
                    jump();
                }
            });

            restartBtn.addEventListener('click', () => {
                initGame();
            });

            // Touch support for mobile
            gameContainer.addEventListener('touchstart', () => {
                jump();
            });

            // Start the game
            initGame();
        });
    </script>
</body>
</html>
