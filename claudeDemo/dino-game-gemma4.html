  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Pixel Dino Run</title>
      <style>
          @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

          body {
              margin: 0;
              padding: 0;
              display: flex;
              justify-content: center;
              align-items: center;
              height: 100vh;
              background-color: #f7f7f7;
              font-family: 'Press Start 2P', cursive;
              overflow: hidden;
          }

          #game-container {
              position: relative;
              width: 800px;
              height: 200px;
              background-color: #fff;
              border-bottom: 4px solid #535353;
              image-rendering: pixelated;
          }

          canvas {
              display: block;
          }

          #ui-overlay {
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              display: none;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              background-color: rgba(255, 255, 255, 0.7);
          }

          #game-over-text {
              color: #535353;
              font-size: 24px;
              margin-bottom: 10px;
          }

          #final-score {
              color: #535            ;
              font-size: 16px;
              margin-bottom: 20px;
          }

          button {
              padding: 10px 20px;
              font-family: 'Press Start 2P', cursive;
              font-size: 14px;
              background-color: #535353;
              color: white;
              border: none;
              cursor: pointer;
              image-rendering: pixelated;
          }

          button:hover {
              background-color: #333;
          }

          #score-board {
              position: absolute;
              top: 10px;
              right: 20px;
              color: #535353;
              font-size: 14px;
          }
      </style>
  </head>
  <body>

  <div id="game-container">
      <canvas id="gameCanvas" width="800" height="200"></canvas>
      <div id="score-board">Score: 0</div>
      <div id="ui-overlay">
          <div id="game-over-text">GAME OVER</div>
          <div id="final-score">Score: 0</div>
          <button id="restart-btn">RESTART</button>
      </div>
  </div>

  <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreBoard = document.getElementById('score-board');
      const uiOverlay = document.getElementById('ui-overlay');
      const gameOverText = document.getElementById('game-over-text');
      const finalScoreText = document.getElementById('final-score');
      const restartBtn = document.getElementById('restart-btn');

      // Game Constants
      const GRAVITY = 0.6;
      const JUMP_STRENGTH = -12;
      const GROUND_Y = 170;
      const INITIAL_SPEED = 5;
      const SPEED_INCREMENT = 0.001;

      // Game State
      let score = 0;
      let gameSpeed = INITIAL_SPEED;
      let isGameOver = false;
      let animationFrameId;

      // Dino Object
      const dino = {
          x: 50,
          y: GROUND_Y - 40,
          width: 40,
          height: 40,
          dy: 0,
          isJumping: false,
          color: '#535353',
          draw() {
              ctx.fillStyle = this.color;
              // Simple pixel dino shape (Body)
              ctx.fillRect(this.x, this.y, this.width, this.height);
              // Eye
              ctx.fillStyle = '#fff';
              ctx.fillRect(this.x + 25, this.y + 10, 5, 5);
              // Small leg detail
              ctx.fillStyle = '#333';
              ctx.fillRect(this.x + 5, this.y + this.height, 10, 5);
          },
          update() {
              if (this.y + this.height < GROUND_Y) {
                  this.dy += GRAVITY;
                  this.isJumping = true;
              } else {
                  this.dy = 0;
                  this.y = GROUND_Y - this.height;
                  this.isJumping = false;
              }

              this.y += this.dy;
          },
          jump() {
              if (!this.isJumping) {
                  this.dy = JUMP_STRENGTH;
              }
          }
      };

      // Obstacles (Cactus)
      let obstacles = [];
      class Cactus {
          constructor(speed) {
              this.width = 20 + Math.random() * 30;
              this.height = 30 + Math.random() * 20;
              this.x = canvas.width;
              this.y = GROUND_Y - this.height;
              this.speed = speed;
          }

          draw() {
              ctx.fillStyle = '#535353';
              // Pixelated cactus shape
              ctx.fillRect(this.x, this.y, this.width, this.height);
              // Adding some "arms" to the cactus
              ctx.fillRect(this.x - 5, this.y + 10, 5, 15);
              ctx.fillRect(this.x + this.width, this.y + 5, 5, 15);
          }

          update() {
              this.x -= this.speed;
          }
      }

      function spawnObstacle() {
          if (isGameOver) return;
          const interval = Math.random() * (2000 - 800) + 800; // Random interval between 0.8s and 2s
          obstacles.push(new Cactus(gameSpeed));
          setTimeout(spawnObstacle, interval / (gameSpeed/5));
      }

      function resetGame() {
          score = 0;
          gameSpeed = INITIAL_SPEED;
          isGameOver = false;
          obstacles = [];
          dino.y = GROUND_Y - dino.height;
          dino.dy = 0;
          uiOverlay.style.display = 'none';
          scoreBoard.innerText = `Score: 0`;
          animate();
      }

      function checkCollision(dino, cactus) {
          return (
              dino.x < cactus.x + cactus.width &&
              dino.x + dino.width > cactus.x &&
              dino.y < cactus.y + cactus.height &&
              dino.y + dino.height > cactus.y
          );
      }

      function animate() {
          if (isGameOver) return;

          animationFrameId = requestAnimationFrame(animate);
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Update speed
          gameSpeed += SPEED_INCREMENT;

          // Draw Ground Line
          ctx.strokeStyle = '#535355';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, GROUND_Y);
          ctx.lineTo(canvas.width, GROUND_Y);
          ctx.stroke();

          // Update and Draw Dino
          dino.update();
          dino.draw();

          // Handle Obstacles
          for (let i = obstacles.length - 1; i >= 0; i--) {
              obstacles[i].update();
              obstacles[i].draw();

              // Collision detection
              if (checkCollision(dino, obstacles[i])) {
                  endGame();
              }

              // Remove off-screen obstacles
              if (obstacles[i].x + obstacles[i].width < 0) {
                  obstacles.splice(i, 1);
                  score++;
                  scoreBoard.innerText = `Score: ${score}`;
              }
          }
      }

      function endGame() {
          isGameOver = true;
          cancelAnimationFrame(animationFrameId);
          finalScoreText.innerText = `Score: ${score}`;
          uiOverlay.style.display = 'flex';
      }

      // Input Handling
      window.addEventListener('keydown', (e) => {
          if (e.code === 'Space') {
              dino.jump();
              // Prevent scrolling with space bar
              e.preventDefault();
          }
      });

      restartBtn.addEventListener('click', resetGame);

      // Start the game loop and obstacle spawning
      spawnObstacle();
      animate();

  </script>
  </body>
  </html>
