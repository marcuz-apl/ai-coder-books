<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Dino Run</title>
  <style>
    :root {
      --ink: #202124;
      --paper: #f8f6e8;
      --sky: #dff3ff;
      --sun: #ffd166;
      --grass: #79b465;
      --ground: #8a6240;
      --cactus: #2e7d54;
      --panel: #fff9df;
      --danger: #d94f43;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(180deg, #bde8ff 0%, #f8f6e8 72%),
        var(--paper);
      font-family: "Courier New", Courier, monospace;
      image-rendering: pixelated;
    }

    .game-shell {
      width: min(920px, calc(100vw - 28px));
      display: grid;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 0 4px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.9);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(18px, 3vw, 28px);
      white-space: nowrap;
    }

    .score-board {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(14px, 2.2vw, 20px);
    }

    .pixel-badge {
      width: 28px;
      height: 28px;
      background: var(--ink);
      box-shadow:
        0 4px 0 var(--ink),
        4px 0 0 var(--ink),
        4px 4px 0 var(--ink),
        8px 8px 0 var(--ink),
        12px 8px 0 var(--ink),
        12px 12px 0 var(--ink),
        16px 12px 0 var(--ink),
        20px 16px 0 var(--ink);
      clip-path: polygon(0 0, 76% 0, 76% 24%, 100% 24%, 100% 52%, 72% 52%, 72% 100%, 0 100%);
    }

    .canvas-wrap {
      position: relative;
      border: 6px solid var(--ink);
      background: var(--sky);
      box-shadow:
        0 8px 0 var(--ink),
        0 16px 30px rgba(32, 33, 36, 0.24);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 7;
      background: var(--sky);
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(248, 246, 232, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms steps(2, end);
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .game-over-panel {
      width: min(380px, 100%);
      padding: 24px 18px 20px;
      text-align: center;
      background: var(--panel);
      border: 5px solid var(--ink);
      box-shadow: 7px 7px 0 var(--ink);
    }

    .game-over-panel h1 {
      margin: 0 0 12px;
      color: var(--danger);
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .final-score {
      min-height: 30px;
      margin: 0 0 18px;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 700;
      text-transform: uppercase;
    }

    button {
      appearance: none;
      border: 4px solid var(--ink);
      padding: 12px 18px;
      color: var(--ink);
      background: var(--sun);
      box-shadow: 5px 5px 0 var(--ink);
      font: 700 18px/1 "Courier New", Courier, monospace;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 80ms steps(2, end), box-shadow 80ms steps(2, end);
    }

    button:hover,
    button:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--ink);
      outline: none;
    }

    button:active {
      transform: translate(5px, 5px);
      box-shadow: 0 0 0 var(--ink);
    }

    .hint {
      min-height: 20px;
      margin: 0;
      padding: 0 4px;
      font-size: clamp(12px, 2vw, 15px);
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      opacity: 0.72;
    }

    @media (max-width: 560px) {
      .game-shell {
        width: min(100vw - 18px, 920px);
        gap: 10px;
      }

      .top-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .canvas-wrap {
        border-width: 4px;
        box-shadow:
          0 6px 0 var(--ink),
          0 12px 22px rgba(32, 33, 36, 0.24);
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Pixel dinosaur runner game">
    <header class="top-bar">
      <div class="title">
        <span class="pixel-badge" aria-hidden="true"></span>
        <span>Pixel Dino Run</span>
      </div>
      <div class="score-board" aria-live="polite">
        <span>Score <span id="score">00000</span></span>
        <span>Best <span id="best">00000</span></span>
      </div>
    </header>

    <section class="canvas-wrap">
      <canvas id="game" width="960" height="420" aria-label="Dinosaur running game canvas"></canvas>
      <div id="overlay" class="overlay">
        <div class="game-over-panel">
          <h1>Game Over</h1>
          <p id="finalScore" class="final-score">Score 00000</p>
          <button id="restart" type="button">Restart</button>
        </div>
      </div>
    </section>

    <p class="hint">Press Space to jump. Avoid the cactus barriers.</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const finalScoreEl = document.getElementById("finalScore");
      const restartBtn = document.getElementById("restart");

      const W = canvas.width;
      const H = canvas.height;
      const groundY = 324;
      const gravity = 0.82;
      const jumpPower = -17.6;

      let dino;
      let obstacles;
      let clouds;
      let dust;
      let score;
      let best;
      let speed;
      let spawnTimer;
      let gameOver;
      let lastTime;
      let frame;

      function readBestScore() {
        try {
          return Number(localStorage.getItem("pixel-dino-best") || 0);
        } catch {
          return 0;
        }
      }

      function saveBestScore(value) {
        try {
          localStorage.setItem("pixel-dino-best", String(value));
        } catch {
          // Local storage can be unavailable in strict privacy contexts.
        }
      }

      function padScore(value) {
        return String(Math.floor(value)).padStart(5, "0");
      }

      function resetGame() {
        dino = {
          x: 112,
          y: groundY - 82,
          w: 72,
          h: 82,
          vy: 0,
          grounded: true,
          blink: 0
        };

        obstacles = [];
        clouds = [
          { x: 120, y: 76, s: 1.0 },
          { x: 480, y: 52, s: 0.8 },
          { x: 830, y: 92, s: 1.2 }
        ];
        dust = [];
        score = 0;
        speed = 7;
        spawnTimer = 64;
        gameOver = false;
        lastTime = performance.now();
        frame = 0;
        best = readBestScore();

        scoreEl.textContent = padScore(score);
        bestEl.textContent = padScore(best);
        overlay.classList.remove("show");
        restartBtn.blur();
      }

      function jump() {
        if (gameOver) {
          resetGame();
          return;
        }

        if (dino.grounded) {
          dino.vy = jumpPower;
          dino.grounded = false;
          for (let i = 0; i < 7; i += 1) {
            dust.push({
              x: dino.x + 8 + i * 8,
              y: groundY + 4,
              vx: -1.2 - Math.random() * 2.8,
              life: 18 + Math.random() * 10
            });
          }
        }
      }

      function createCactus() {
        const kind = Math.random();
        const width = kind > 0.72 ? 72 : kind > 0.38 ? 50 : 34;
        const height = 58 + Math.floor(Math.random() * 38);
        obstacles.push({
          x: W + 20,
          y: groundY - height,
          w: width,
          h: height,
          passed: false,
          variant: width
        });
      }

      function rectsOverlap(a, b) {
        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      function getDinoHitbox() {
        return {
          x: dino.x + 14,
          y: dino.y + 8,
          w: dino.w - 22,
          h: dino.h - 10
        };
      }

      function getObstacleHitbox(obstacle) {
        return {
          x: obstacle.x + 7,
          y: obstacle.y + 4,
          w: obstacle.w - 14,
          h: obstacle.h - 4
        };
      }

      function endGame() {
        gameOver = true;
        best = Math.max(best, score);
        saveBestScore(Math.floor(best));
        scoreEl.textContent = padScore(score);
        bestEl.textContent = padScore(best);
        finalScoreEl.textContent = `Score ${padScore(score)}`;
        overlay.classList.add("show");
        restartBtn.focus();
      }

      function update(dt) {
        if (gameOver) {
          return;
        }

        frame += 1;
        speed = Math.min(15.5, speed + dt * 0.00072);
        score += dt * 0.016 * (speed / 7);
        scoreEl.textContent = padScore(score);

        dino.vy += gravity * (dt / 16.67);
        dino.y += dino.vy * (dt / 16.67);
        if (dino.y >= groundY - dino.h) {
          dino.y = groundY - dino.h;
          dino.vy = 0;
          dino.grounded = true;
        }

        spawnTimer -= dt / 16.67;
        if (spawnTimer <= 0) {
          createCactus();
          spawnTimer = 62 + Math.random() * 62 - Math.min(24, speed * 1.2);
        }

        obstacles.forEach((obstacle) => {
          obstacle.x -= speed * (dt / 16.67);
        });
        obstacles = obstacles.filter((obstacle) => obstacle.x + obstacle.w > -30);

        clouds.forEach((cloud) => {
          cloud.x -= (0.35 + cloud.s * 0.18) * (dt / 16.67);
          if (cloud.x < -110) {
            cloud.x = W + 80 + Math.random() * 220;
            cloud.y = 42 + Math.random() * 74;
          }
        });

        dust.forEach((particle) => {
          particle.x += particle.vx * (dt / 16.67);
          particle.life -= dt / 16.67;
        });
        dust = dust.filter((particle) => particle.life > 0);

        const dinoBox = getDinoHitbox();
        for (const obstacle of obstacles) {
          if (rectsOverlap(dinoBox, getObstacleHitbox(obstacle))) {
            endGame();
            break;
          }
        }
      }

      function fillRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function drawCloud(cloud) {
        const x = Math.round(cloud.x);
        const y = Math.round(cloud.y);
        const s = cloud.s;
        fillRect(x, y + 16 * s, 72 * s, 16 * s, "rgba(255,255,255,0.9)");
        fillRect(x + 12 * s, y + 4 * s, 24 * s, 16 * s, "rgba(255,255,255,0.9)");
        fillRect(x + 36 * s, y, 24 * s, 20 * s, "rgba(255,255,255,0.9)");
        fillRect(x + 60 * s, y + 10 * s, 20 * s, 22 * s, "rgba(255,255,255,0.9)");
      }

      function drawGround() {
        fillRect(0, groundY, W, H - groundY, "#8a6240");
        fillRect(0, groundY, W, 12, "#79b465");

        const offset = Math.floor((frame * speed) % 56);
        for (let x = -offset; x < W; x += 56) {
          fillRect(x, groundY + 10, 24, 6, "#5f8f4f");
          fillRect(x + 32, groundY + 30, 12, 8, "#6f4e35");
          fillRect(x + 8, groundY + 58, 28, 5, "#6f4e35");
        }
      }

      function drawDino() {
        const x = Math.round(dino.x);
        const y = Math.round(dino.y);
        const body = "#202124";
        const shade = "#3b3d42";
        const eye = dino.blink > 0 ? "#202124" : "#f8f6e8";

        fillRect(x + 30, y, 38, 12, body);
        fillRect(x + 26, y + 12, 46, 16, body);
        fillRect(x + 52, y + 28, 20, 12, body);
        fillRect(x + 18, y + 28, 42, 34, body);
        fillRect(x + 6, y + 38, 22, 18, body);
        fillRect(x, y + 46, 18, 10, body);
        fillRect(x + 28, y + 58, 16, 18, body);
        fillRect(x + 54, y + 56, 14, 20, body);

        if (dino.grounded) {
          const runningLeft = Math.floor(frame / 7) % 2 === 0;
          if (runningLeft) {
            fillRect(x + 26, y + 74, 16, 8, body);
            fillRect(x + 56, y + 70, 18, 8, body);
          } else {
            fillRect(x + 22, y + 70, 18, 8, body);
            fillRect(x + 54, y + 74, 16, 8, body);
          }
        } else {
          fillRect(x + 24, y + 72, 16, 8, body);
          fillRect(x + 54, y + 72, 16, 8, body);
        }

        fillRect(x + 36, y + 36, 16, 8, shade);
        fillRect(x + 60, y + 8, 6, 6, eye);
        fillRect(x + 67, y + 28, 9, 8, "#dff3ff");
      }

      function drawCactus(obstacle) {
        const x = Math.round(obstacle.x);
        const y = Math.round(obstacle.y);
        const stemW = 18;
        const center = x + Math.floor(obstacle.w / 2) - Math.floor(stemW / 2);

        fillRect(center, y, stemW, obstacle.h, "#2e7d54");
        fillRect(center + 4, y + 8, stemW - 8, obstacle.h - 8, "#3c9b68");

        if (obstacle.w > 40) {
          fillRect(x + 4, y + 24, 14, 14, "#2e7d54");
          fillRect(x + 4, y + 8, 10, 30, "#2e7d54");
          fillRect(x + 4, y + 8, 10, 8, "#3c9b68");
        }

        if (obstacle.w > 32) {
          fillRect(x + obstacle.w - 18, y + 34, 14, 14, "#2e7d54");
          fillRect(x + obstacle.w - 14, y + 18, 10, 30, "#2e7d54");
          fillRect(x + obstacle.w - 14, y + 18, 10, 8, "#3c9b68");
        }

        fillRect(center - 3, y + obstacle.h - 8, stemW + 6, 8, "#246642");
      }

      function drawSun() {
        fillRect(W - 112, 36, 52, 52, "#ffd166");
        fillRect(W - 100, 24, 28, 12, "#ffd166");
        fillRect(W - 100, 88, 28, 12, "#ffd166");
        fillRect(W - 124, 48, 12, 28, "#ffd166");
        fillRect(W - 60, 48, 12, 28, "#ffd166");
      }

      function drawDust() {
        dust.forEach((particle) => {
          const alpha = Math.max(0, particle.life / 28);
          fillRect(particle.x, particle.y, 8, 5, `rgba(95, 78, 53, ${alpha})`);
        });
      }

      function render() {
        ctx.clearRect(0, 0, W, H);
        fillRect(0, 0, W, H, "#dff3ff");
        drawSun();
        clouds.forEach(drawCloud);
        drawGround();
        drawDust();
        obstacles.forEach(drawCactus);
        drawDino();

        if (gameOver) {
          fillRect(dino.x + 46, dino.y + 8, 18, 6, "#d94f43");
        }
      }

      function loop(now) {
        const dt = Math.min(32, now - lastTime);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          jump();
        }
      });

      canvas.addEventListener("pointerdown", jump);
      restartBtn.addEventListener("click", resetGame);

      resetGame();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
